<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama 聊天助手</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app {
      width: 900px;
      max-width: 95vw;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 16px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .mode-switch {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 22px;
      background: rgba(255,255,255,0.3);
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .switch.active { background: #fff; }
    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      background: #667eea;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .switch.active::after { transform: translateX(22px); background: #764ba2; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f7f7f9;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

    .message {
      display: flex;
      margin-bottom: 18px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user { flex-direction: row-reverse; }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }
    .message.bot .avatar { background: linear-gradient(135deg, #667eea, #764ba2); margin-right: 10px; }
    .message.user .avatar { background: linear-gradient(135deg, #f093fb, #f5576c); margin-left: 10px; }

    .bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.bot .bubble {
      background: #fff;
      color: #333;
      border-top-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .message.user .bubble {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .typing-cursor::after {
      content: '|';
      animation: blink 0.8s infinite;
      color: #667eea;
      margin-left: 2px;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .input-area {
      padding: 16px 20px;
      background: #fff;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-area textarea {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 46px;
      max-height: 120px;
      transition: border-color 0.3s;
    }
    .input-area textarea:focus { border-color: #667eea; }
    .send-btn {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .send-btn:hover:not(:disabled) { opacity: 0.9; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .empty-tip {
      text-align: center;
      color: #999;
      padding: 60px 20px;
      font-size: 14px;
    }
    .stop-btn {
      padding: 12px 20px;
      background: #f5576c;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>🤖 Ollama 聊天助手</h1>
      <div class="mode-switch">
        <span>普通模式</span>
        <div class="switch" :class="{ active: streamMode }" @click="streamMode = !streamMode"></div>
        <span>打字机模式</span>
      </div>
    </div>

    <div class="messages" ref="messagesEl">
      <div class="empty-tip" v-if="messages.length === 0">
        你好！我是 Ollama 聊天助手，请问有什么可以帮助你的？
      </div>
      <div
        v-for="(msg, index) in messages"
        :key="index"
        class="message"
        :class="msg.role"
      >
        <div class="avatar">{{ msg.role === 'user' ? '👤' : '🤖' }}</div>
        <div
          class="bubble"
          :class="{ 'typing-cursor': msg.role === 'bot' && msg.typing }"
        >{{ msg.content || (msg.role === 'bot' ? '思考中...' : '') }}</div>
      </div>
    </div>

    <div class="input-area">
      <textarea
        v-model="inputText"
        @keydown.enter.exact.prevent="sendMessage"
        @input="autoResize"
        placeholder="输入消息，按 Enter 发送，Shift+Enter 换行"
        :disabled="loading"
        rows="1"
      ></textarea>
      <button
        v-if="loading && streamMode"
        class="stop-btn"
        @click="stopStream"
      >停止</button>
      <button
        v-else
        class="send-btn"
        :disabled="loading || !inputText.trim()"
        @click="sendMessage"
      >发送</button>
    </div>
  </div>

  <script>
    const { createApp, ref, nextTick } = Vue;

    createApp({
      setup() {
        const inputText = ref('');
        const messages = ref([]);
        const loading = ref(false);
        const streamMode = ref(true);  // 默认打字机模式
        const messagesEl = ref(null);
        let abortController = null;

        const autoResize = (e) => {
          e.target.style.height = 'auto';
          e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        };

        const scrollToBottom = () => {
          nextTick(() => {
            if (messagesEl.value) {
              messagesEl.value.scrollTop = messagesEl.value.scrollHeight;
            }
          });
        };

        // 普通非流式请求
        const sendNormal = async (question) => {
          try {
            const res = await fetch(`/chat?question=${encodeURIComponent(question)}`);
            const data = await res.text();
            const botMsg = messages.value.find(m => m.role === 'bot' && m.typing);
            if (botMsg) {
              botMsg.content = data;
              botMsg.typing = false;
            }
          } catch (err) {
            console.error(err);
            const botMsg = messages.value.find(m => m.role === 'bot' && m.typing);
            if (botMsg) {
              botMsg.content = '请求失败：' + err.message;
              botMsg.typing = false;
            }
          } finally {
            loading.value = false;
          }
        };

        // SSE 流式请求
        const sendStream = async (question) => {
          abortController = new AbortController();
          try {
            const resp = await fetch(
              `/stream_chat?question=${encodeURIComponent(question)}`,
              { signal: abortController.signal }
            );
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            const botMsg = messages.value.find(m => m.role === 'bot' && m.typing);

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });

              // 按 SSE 格式解析 \n\n
              const parts = buffer.split('\n\n');
              buffer = parts.pop();

              for (const part of parts) {
                const line = part.trim();
                if (line.startsWith('data: ')) {
                  const data = line.slice(6);
                  if (data === '[DONE]') {
                    if (botMsg) botMsg.typing = false;
                    break;
                  }
                  try {
                    const json = JSON.parse(data);
                    if (botMsg) {
                      botMsg.content += json.content || '';
                      scrollToBottom();
                    }
                  } catch (e) {
                    console.warn('解析 SSE 数据失败:', e);
                  }
                }
              }
            }
            if (botMsg && botMsg.typing) botMsg.typing = false;
          } catch (err) {
            if (err.name === 'AbortError') {
              const botMsg = messages.value.find(m => m.role === 'bot' && m.typing);
              if (botMsg) botMsg.typing = false;
            } else {
              console.error(err);
              const botMsg = messages.value.find(m => m.role === 'bot' && m.typing);
              if (botMsg) {
                botMsg.content = botMsg.content || '请求失败：' + err.message;
                botMsg.typing = false;
              }
            }
          } finally {
            loading.value = false;
            abortController = null;
          }
        };

        const stopStream = () => {
          if (abortController) abortController.abort();
        };

        const sendMessage = () => {
          const question = inputText.value.trim();
          if (!question || loading.value) return;

          // 添加用户消息
          messages.value.push({ role: 'user', content: question });
          inputText.value = '';
          loading.value = true;
          scrollToBottom();

          // 添加空的机器人消息占位
          messages.value.push({ role: 'bot', content: '', typing: true });

          if (streamMode.value) {
            sendStream(question);
          } else {
            sendNormal(question);
          }
        };

        return {
          inputText,
          messages,
          loading,
          streamMode,
          messagesEl,
          autoResize,
          sendMessage,
          stopStream,
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
